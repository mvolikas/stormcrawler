name: Java CI with Maven 4

on:
  # Run CI on pushes to "main" or on pull requests targeting "main".
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-maven4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache local Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven4-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven4-

      - name: Install Maven 4
        run: |
          MAVEN_VERSION=4.0.0-rc-5
          BASE_URL="https://dlcdn.apache.org/maven/maven-4/${MAVEN_VERSION}/binaries"
          curl -fsSL "${BASE_URL}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o maven.tar.gz
          mkdir -p "$HOME/maven"
          tar -xzf maven.tar.gz -C "$HOME/maven"
          echo "M2_HOME=$HOME/maven/apache-maven-${MAVEN_VERSION}" >> "$GITHUB_ENV"
          echo "$HOME/maven/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          rm maven.tar.gz
          mvn -version

      - name: Build with Maven 4
        run: mvn --errors --batch-mode --show-version verify
