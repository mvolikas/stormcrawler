name: Java CI with Maven 4

on:
  # Run CI on Pushes to "main"" or on pull requests targeting "main".
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    uses: apache/maven-gh-actions-shared/.github/workflows/maven-verify.yml@v4
    with:
      os-matrix: '[ "ubuntu-latest" ]'
      jdk-matrix: '[ "17" ]'
      jdk-distribution-matrix: '[ "temurin" ]'

      maven4-enabled: true

      ff-goal: 'verify'
      verify-goal: 'verify'
      ff-site-run: false
